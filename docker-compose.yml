services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-recipe_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-recipe_app}
      POSTGRES_DB: ${DATABASE_NAME:-recipe_app}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-recipe_app} -d ${DATABASE_NAME:-recipe_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - npmrc
    command: npm run start:dev --workspace @recipe-app/api
    environment:
      API_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-recipe_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-recipe_app}
      DATABASE_NAME: ${DATABASE_NAME:-recipe_app}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - npmrc
    command: npm run dev --workspace @recipe-app/web
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:

secrets:
  npmrc:
    environment: GITHUB_NPMRC
